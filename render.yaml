# BidSentinel — Render Blueprint (free tier)
#
#   1. Create a free PostgreSQL at https://neon.tech (or Supabase) and copy
#      its connection string.
#   2. In Render choose "New" → "Blueprint" and pick this repository.
#   3. Render will prompt for every `sync: false` variable below.
#   4. Once deployed, set ALLOWED_ORIGINS to your Vercel URL.
#
# Note: Render's free plan has no background-worker support. The API runs
# batch verification synchronously when Redis is absent, so the Celery
# worker in backend/app/workers is optional — see docs/DEPLOYMENT_FREE.md.

services:
  - type: web
    name: bidsentinel-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      # Async SQLAlchemy URL — keep the +asyncpg driver.
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Deterministic offline portal responses.
      - key: CONNECTOR_MODE
        value: mock
      - key: AI_PROVIDER
        value: mock
